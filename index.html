<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real or Fake? Headline Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Real or Fake?</h1>
        <p class="subtitle">Two headlines are real. One is made up.<br>Can you spot which one?</p>
    </header>

    <main>
        <div class="round-header">
            <div class="round-badge">
                <span>Round</span>
                <strong id="round-num">1</strong>
                <span>of <span id="total-rounds">?</span></span>
            </div>
            <div class="round-theme" id="round-theme">Loading…</div>
        </div>

        <div class="headlines-grid" id="headlines-grid">
            <div class="loading">Loading quiz…</div>
        </div>

        <p class="hint">Real headlines open the article in a new tab — the fake one brings a surprise</p>
    </main>

    <!-- Congratulations overlay -->
    <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-label="You found the fake headline!">
        <div class="overlay-content">
            <div class="confetti-burst" aria-hidden="true">🎉</div>
            <h2>You Found the Fake!</h2>
            <div class="fake-reveal">
                <p class="fake-label">The fake headline was:</p>
                <blockquote id="fake-headline-text"></blockquote>
            </div>
            <div class="real-links" id="real-links">
                <p class="fake-label">The real ones:</p>
                <ul id="real-links-list"></ul>
            </div>
            <button class="next-btn" id="next-btn">Next Round →</button>
        </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
